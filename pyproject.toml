[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "debocker"
dynamic = ["version"]
description = "Build Docker images of old Ubuntu and Debian releases"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Matthew Shaw", email = "mshaw.cx@gmail.com"}]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/shawcx/debocker"

[project.scripts]
debocker = "debocker:main"

[tool.setuptools]
packages = ["debocker"]

[tool.setuptools.package-data]
debocker = ["packages.default", "certs/*.crt"]

[tool.setuptools.dynamic]
version = {attr = "debocker.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
